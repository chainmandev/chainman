name: Qualify restricted Podman prerequisites
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TOOLCHAIN_MODE: host-nix
      CHAINMAN_SETUP: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          path: checkout with spaces
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Check the exact source with real rootless Podman
        working-directory: checkout with spaces
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          podman --version
          ./scripts/enter.sh core env CHAINMAN_TEST_ENGINE_PATH="$PATH" CHAINMAN_TEST_CONTAINER=podman sh -eu -c 'export PATH="$PATH:$CHAINMAN_TEST_ENGINE_PATH"; python3 -u -B -m unittest discover -s tests -p test_bootstrap.py -k test_container_bootstrap_without_host_nix_or_languages -k test_container_native_hook_setup_and_commit_a -v'
          test -z "$(git status --porcelain)"
