[mypy]
# Start with the runtime/control boundary, checking unannotated function bodies
# too. Imported adapters retain their signatures without claiming their bodies
# pass this gate. Expand this explicit scope as their data models gain types.
files = scripts/configuration.py, scripts/project_environment.py, scripts/bootstrap_plan.py, scripts/config_inspection.py, scripts/resources.py, scripts/services.py, scripts/native_tasks.py, scripts/chainman.py, scripts/toolchain.py, scripts/update_staging.py, scripts/chainman_updates.py, scripts/recipes.py, scripts/workflows.py, scripts/dependency_audit.py
check_untyped_defs = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
incremental = False

# Spell out the pinned mypy --strict flags: its umbrella switch is global even
# in a module section. Keep these guarantees as other boundaries gain types.
[mypy-configuration,resources]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
warn_return_any = True
implicit_reexport = False
strict_equality = True
extra_checks = True
disallow_any_explicit = True
warn_unreachable = True
