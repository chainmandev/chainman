name: Swift candidate canonical path qualification
"on":
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source commit to test; this workflow cannot publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  swift:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      TOOLCHAIN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: checkout with spaces
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm exact source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Apple SDK preflight
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- sdk-doctor apple
      - name: Core-profile source binding regressions
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -m unittest discover -s tests -p test_swift_sources.py -v
      - name: Full native Swift qualification
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- swift-test
      - name: Confirm source was not edited
        if: always()
        run: test -z "$(git status --porcelain)"
