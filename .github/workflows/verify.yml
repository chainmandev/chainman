name: Qualify exact macOS native control
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TOOLCHAIN_MODE: host-nix
      CHAINMAN_SETUP: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          path: checkout with spaces
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Qualify unchanged source through the normal native test entry
        working-directory: checkout with spaces
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          ./scripts/enter.sh control python3 -u -B scripts/control_test.py
          test -z "$(git status --porcelain)"
