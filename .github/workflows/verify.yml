name: Diagnose macOS core qualification
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      TOOLCHAIN_MODE: host-nix
      CHAINMAN_SETUP: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          path: checkout with spaces
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Diagnose test progress with a bounded stack dump
        working-directory: checkout with spaces
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -u -B - <<'PYTHON'
          import faulthandler
          import sys
          import unittest
          sys.path.insert(0, 'tests')
          from test_bootstrap import BootstrapTests
          original = BootstrapTests.run_bootstrap
          def visible(self, *args, **kwargs):
              result = original(self, *args, **kwargs)
              print('BOOTSTRAP', args, 'STATUS', result.returncode, 'STDOUT', repr(result.stdout), 'STDERR', repr(result.stderr), flush=True)
              return result
          BootstrapTests.run_bootstrap = visible
          faulthandler.dump_traceback_later(600, exit=True)
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(BootstrapTests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          faulthandler.cancel_dump_traceback_later()
          raise SystemExit(not result.wasSuccessful())
          PYTHON
