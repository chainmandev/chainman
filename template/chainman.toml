schema = 1
modules = ["core"]

[project]
default_profile = "core"

[commands]
format-check = [["python3", "scripts/demo.py", "format", "--check"]]

[profiles.core]
flake = ".#core"
[profiles.javascript]
flake = ".#javascript"
[profiles.rust]
flake = ".#rust"
compiler_cache = true
[profiles.python]
flake = ".#python"
[profiles.go]
flake = ".#go"
[profiles.flutter]
flake = ".#flutter"
[profiles.swift]
flake = ".#swift"
[profiles.compose]
flake = ".#compose"
[profiles.browser]
flake = ".#browser"

[cache]
build_limit_gib = 12
compiler_limit_gib = 8
stale_hours = 48
automatic_prune = true

[updates]
minimum_age_days = 30
outputs = ["flake.lock", ".github/workflows/verify.yml"]

[ci]
disposable_sdks = ["android", "dotnet", "haskell"]
