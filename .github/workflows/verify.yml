name: Container descriptor boundary qualification
"on":
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source commit to test; this workflow cannot publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  boundary:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {runner: ubuntu-24.04, engine: docker}
          - {runner: ubuntu-24.04, engine: podman}
          - {runner: macos-15, engine: none}
          - {runner: macos-15-intel, engine: none}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      TOOLCHAIN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: checkout with spaces
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm exact source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Full native ownership qualification
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- control-test
      - name: Real engine cleanup, nested context, consent and cancellation
        if: matrix.engine != 'none'
        env:
          CHAINMAN_TEST_CONTAINER: ${{ matrix.engine }}
        run: |
          export CHAINMAN_TEST_ENGINE_PATH="$PATH"
          # shellcheck disable=SC2016
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec sh -eu -c 'export PATH="$PATH:$CHAINMAN_TEST_ENGINE_PATH"; exec python3 -B -' <<'PY'
          import sys, unittest
          sys.path.insert(0, "tests")
          from test_bootstrap import BootstrapTests
          suite = unittest.TestSuite(BootstrapTests(name) for name in (
              "test_container_stale_setup_consent_preserves_piped_task_input",
              "test_public_nested_service_entry_preserves_fd9_context",
              "test_container_preview_port_and_interruption",
          ))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Confirm source was not edited
        if: always()
        run: test -z "$(git status --porcelain)"
