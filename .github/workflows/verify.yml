name: Diagnose macOS native control qualification
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      TOOLCHAIN_MODE: host-nix
      CHAINMAN_SETUP: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
          path: checkout with spaces
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Qualify native controller with bounded per-test diagnostics
        working-directory: checkout with spaces
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          ./scripts/enter.sh control python3 -u -B - <<'PYTHON'
          import faulthandler
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import tempfile
          import unittest

          root = Path.cwd()
          sys.path[:0] = [str(root / 'scripts'), str(root / 'tests')]
          import toolchain as tc

          source = root / 'nix/control'
          formatted = subprocess.check_output(['gofmt', '-l', *map(str, source.glob('*.go'))], text=True)
          assert not formatted, formatted
          subprocess.run(['go', 'vet', '-mod=readonly', './...'], cwd=source, check=True)
          subprocess.run(['go', 'test', '-race', '-mod=readonly', './...'], cwd=source, env=dict(os.environ, CGO_ENABLED='1'), check=True)
          target = 'darwin-' + {'arm64': 'arm64', 'x86_64': 'amd64'}[platform.machine()]
          with tempfile.TemporaryDirectory(prefix='native consent diagnostic ') as directory:
              package = subprocess.check_output([
                  tc.nix_command(), '--extra-experimental-features', 'nix-command flakes',
                  'build', tc.nix_path_reference(root / 'nix', 'control-' + target),
                  '--out-link', str(Path(directory) / 'runtime'), '--print-out-paths',
                  '--no-write-lock-file',
              ], text=True).strip()
              os.environ['CHAINMAN_TEST_HOOK_CONTROL'] = package + '/bin/chainman-control'
              os.environ['CHAINMAN_TEST_CONTROL'] = package + '/bin/chainman-control'
              os.environ['CHAINMAN_TEST_PROCESS_COMPOSE'] = package + '/bin/process-compose'
              os.environ['CHAINMAN_TEST_WATCHEXEC'] = package + '/bin/watchexec'
              class BoundedResult(unittest.TextTestResult):
                  def startTest(self, test):
                      print('\nStarting:', test.id(), flush=True)
                      faulthandler.dump_traceback_later(150, exit=True)
                      super().startTest(test)
                  def stopTest(self, test):
                      faulthandler.cancel_dump_traceback_later()
                      super().stopTest(test)
                  def diagnostics(self, test):
                      state = getattr(test, 'state', None)
                      if state:
                          for log in sorted(state.glob('*.log')):
                              print('\nFixture log:', log.name, '\n', log.read_text(errors='replace')[-6000:], flush=True)
                      root = getattr(test, 'root', None)
                      if root:
                          for name in ('pid', 'signals', 'ready'):
                              path = root / name
                              print('Fixture file:', name, path.read_text() if path.exists() else '<absent>', flush=True)
                  def addError(self, test, err):
                      self.diagnostics(test)
                      super().addError(test, err)
                  def addFailure(self, test, err):
                      self.diagnostics(test)
                      super().addFailure(test, err)
              suite = unittest.defaultTestLoader.loadTestsFromNames([
                  'test_native_hooks', 'test_setup_terminal', 'test_terminal_fixture', 'test_services_control',
              ])
              result = unittest.TextTestRunner(verbosity=2, resultclass=BoundedResult).run(suite)
              for system in ('linux', 'darwin'):
                  for arch in ('arm64', 'amd64'):
                      subprocess.run([
                          'go', 'build', '-mod=readonly', '-trimpath', '-buildvcs=false',
                          '-o', str(Path(directory) / (system + '-' + arch)), '.',
                      ], cwd=source, env=dict(os.environ, CGO_ENABLED='0', GOOS=system, GOARCH=arch), check=True)
                      print(system, arch, 'cross-build passed', flush=True)
              raise SystemExit(not result.wasSuccessful())
          PYTHON
