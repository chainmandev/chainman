name: Publish rolling Chainman
"on":
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact full commit at the selected staging workflow ref
        required: true
        type: string
      expected_default_sha:
        description: Public default-branch SHA observed before qualification
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chainman-default-publication
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'chainmandev/chainman'
    uses: ./.github/workflows/verify.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
  publish:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED: ${{ inputs.candidate_sha }}
      BASE: ${{ inputs.expected_default_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Advance the default branch to the qualified commit
        env:
          EVENT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' "$EXPECTED" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$BASE" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$EVENT" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          advertisement=$(git ls-remote --symref --exit-code origin HEAD)
          default_ref=$(printf '%s\n' "$advertisement" | sed -n 's/^ref: \(refs\/heads\/[^[:space:]]*\)[[:space:]]HEAD$/\1/p')
          git check-ref-format "$default_ref"
          observed=$(printf '%s\n' "$advertisement" | awk '$1 != "ref:" && $2 == "HEAD" {print $1}')
          test "$observed" = "$BASE"
          git fetch --no-tags origin "$BASE"
          git merge-base --is-ancestor "$BASE" "$EXPECTED"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="$default_ref:$BASE" origin "$EXPECTED:$default_ref"
          test "$(git ls-remote --exit-code origin "$default_ref" | cut -f1)" = "$EXPECTED"
  readback:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [host-nix, container-nix]
    env:
      EXPECTED: ${{ inputs.candidate_sha }}
      CHAINMAN_MODE: ${{ matrix.mode }}
      CHAINMAN_CONTAINER_ENGINE: docker
    steps:
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Read public Git and initialize a fresh starter
        run: |
          set -eu
          git clone --depth 1 https://github.com/chainmandev/chainman.git "$RUNNER_TEMP/public checkout"
          checkout="$RUNNER_TEMP/public checkout"
          test "$(git -C "$checkout" rev-parse HEAD)" = "$EXPECTED"
          export XDG_CACHE_HOME="$RUNNER_TEMP/fresh cache"
          nix --extra-experimental-features 'nix-command flakes' build "path:$checkout/nix#just" --out-link "$RUNNER_TEMP/just"
          "$RUNNER_TEMP/just/bin/just" --justfile "$checkout/justfile" init "$RUNNER_TEMP/public starter" --no-git
          test "$(cat "$RUNNER_TEMP/public starter/chainman.lock")" = "$EXPECTED"
          rm -rf "$checkout"
          cd "$RUNNER_TEMP/public starter"
          "$RUNNER_TEMP/just/bin/just" chainman setup
          "$RUNNER_TEMP/just/bin/just" verify
