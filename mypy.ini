[mypy]
# Check runtime/control boundaries and the named adapter implementations,
# including unannotated bodies. Other imported adapters retain their signatures
# without claiming their bodies pass. Expand scope as their data models gain types.
files = scripts/configuration.py, scripts/project_environment.py, scripts/bootstrap_plan.py, scripts/config_inspection.py, scripts/resources.py, scripts/services.py, scripts/native_tasks.py, scripts/chainman.py, scripts/toolchain.py, scripts/update_staging.py, scripts/transaction_state.py, scripts/source_workflow.py, scripts/chainman_updates.py, scripts/recipes.py, scripts/workflows.py, scripts/dependency_audit.py, scripts/dependency_identity.py, scripts/adapter_data.py, scripts/lock_adapters.py, scripts/javascript_npm.py, scripts/javascript_updates.py, scripts/registry.py, scripts/timing.py, scripts/control_release.py, scripts/package.py, scripts/example.py, scripts/control_test.py, scripts/ci_cleanup.py, scripts/generate.py, scripts/native_sdks.py, scripts/toolchain_build.py, scripts/format.py
check_untyped_defs = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
incremental = False

# Spell out the pinned mypy --strict flags: its umbrella switch is global even
# in a module section. Keep these guarantees as other boundaries gain types.
[mypy-configuration,resources,transaction_state,dependency_identity,adapter_data,timing,control_release,package,example,control_test,ci_cleanup,generate,native_sdks,toolchain_build,format,recipes]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
warn_return_any = True
implicit_reexport = False
strict_equality = True
extra_checks = True
disallow_any_explicit = True
warn_unreachable = True

[mypy-update_staging,source_workflow,lock_adapters,javascript_npm]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# The pinned third-party semantic_version distribution has no typing metadata.
# Keep this exception confined to the external dependency, not adapter modules.
[mypy-semantic_version]
ignore_missing_imports = True
