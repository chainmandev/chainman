name = "core"
profile = "core"
directory = "."
inputs = ["examples/core/*.json", "examples/core/*.txt"]
artifacts = ["examples/core/labels.txt"]
[commands]
setup = [["python3", "scripts/demo.py", "generate", "--check"]]
build = [["python3", "scripts/demo.py", "build"]]
test = [["python3", "-B", "-m", "unittest", "discover", "-s", "examples/core"]]
verify = [["python3", "scripts/demo.py", "format", "--check"], ["python3", "scripts/demo.py", "generate", "--check"], ["python3", "-B", "-m", "unittest", "discover", "-s", "examples/core"], ["python3", "scripts/demo.py", "build"]]
format = [["python3", "scripts/demo.py", "format"], ["python3", "scripts/demo.py", "generate"]]
