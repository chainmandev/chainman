name: Bounded Darwin terminal stack diagnostic
"on":
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source to diagnose; cannot publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  terminal:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: checkout with spaces
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm exact source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED" && test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Bounded stack trace of lease job-control fixture
        run: |
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -c 'import faulthandler,sys,unittest; sys.path.insert(0,"tests"); faulthandler.dump_traceback_later(45,exit=True); unittest.main(module="test_storage",argv=["diagnostic"],verbosity=2)'
