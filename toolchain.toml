schema = 1
modules = ["core"]

[cache]
build_limit_gib = 12
compiler_limit_gib = 8
stale_hours = 48
automatic_prune = true

[updates]
minimum_age_days = 30
# Only these files may change during the update transaction.
outputs = ["nix/flake.lock", "nix/container-image.txt", "bootstrap/chainman.sh", ".github/workflows/verify.yml", ".github/workflows/release.yml", "template/.github/workflows/verify.yml"]
# Additional pins and ecosystem lock audits live in dependencies.toml.

[ci]
# Explicit ci-prune only; never part of normal setup, verification or cleanup.
disposable_sdks = ["android", "dotnet", "haskell"]


[formatters.python]
paths = ["*.py", "*.pyi"]
profile = "core"
write = ["ruff", "--isolated", "format", "--no-cache", "--"]
check = ["ruff", "--isolated", "format", "--no-cache", "--check", "--"]

[formatters.shell]
paths = ["*.sh"]
profile = "core"
write = ["shfmt", "-i", "4", "-bn", "-ci", "-sr", "-w", "--"]
check = ["shfmt", "-i", "4", "-bn", "-ci", "-sr", "-d", "--"]

[formatters.nix]
paths = ["*.nix"]
profile = "core"
write = ["nixfmt", "--"]
check = ["nixfmt", "--check", "--"]
