name: Attestation SDK smoke
"on":
  push:
    branches: [codex/attestation-smoke-20261109]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
jobs:
  sdk-smoke:
    name: SDK smoke
    if: github.repository == 'chainmandev/chainman' && github.ref == 'refs/heads/codex/attestation-smoke-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm exact smoke source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Pack fixed bytes with the packaged npm runtime
        run: |
          nix develop path:./nix#attest --command \
            python3 -I -B scripts/attestation_smoke.py pack "$RUNNER_TEMP/chainman-smoke"
      - name: Sign through the isolated Python entry and packaged SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop path:./nix#attest --command \
            python3 -I -B scripts/isolated.py attestation_entry.py \
            attest create "$RUNNER_TEMP/chainman-smoke/manifest.json" \
            --run "$GITHUB_RUN_ID" --policy "$RUNNER_TEMP/chainman-smoke/policy.json"
      - name: Publish the exact bytes and saved bundle to native npm loopback
        env:
          CHAINMAN_TEST_ATTEST_RUNTIME: "1"
          CHAINMAN_ATTEST_SMOKE_TARBALL: ${{ runner.temp }}/chainman-smoke/chainman-attestation-smoke-0.0.0-smoke.0.tgz
          CHAINMAN_ATTEST_SMOKE_BUNDLE: ${{ runner.temp }}/chainman-smoke/chainman-attestation-smoke-0.0.0-smoke.0.tgz.sigstore.json
          CHAINMAN_ATTEST_SMOKE_REPOSITORY: ${{ github.repository }}
        run: |
          nix develop path:./nix#attest --command \
            python3 -B -m unittest discover -s tests -p test_attestation_runtime.py -v
      - name: Retain the exact signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chainman-smoke/*.sigstore.json
          if-no-files-found: error
          retention-days: 3
      - name: Retain bytes for independent local comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chainman-smoke/*.tgz
          if-no-files-found: error
          retention-days: 3
