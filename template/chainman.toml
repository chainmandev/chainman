schema = 3

[project]
default_profile = "default"

[profiles.default]
flake = ".#default"

[tasks.verify]
commands = [["python3", "scripts/demo.py", "--check"]]

[recipes]
verify = ["verify"]

[updates]
minimum_age_days = 30
outputs = ["flake.lock"]
verify_task = "verify"

[updates.adapters.nix]
adapter = "nix"
inputs = [
  { directory = ".", input = "nixpkgs", repository = "NixOS/nixpkgs", branch = "nixos-unstable" },
  { directory = ".", input = "nixpkgs-darwin", repository = "NixOS/nixpkgs", branch = "nixpkgs-26.05-darwin" },
]

[[updates.steps]]
resolve = "nix"
