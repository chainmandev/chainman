name: Darwin fixture and native qualification diagnostics
"on":
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source commit to test; this workflow cannot publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      CHAINMAN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: checkout with spaces
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm exact tested source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          set -eu
          printf '%s\n' "$EXPECTED" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Storage and terminal fixtures
        run: |
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -c 'import faulthandler,sys,unittest; sys.path.insert(0,"tests"); faulthandler.dump_traceback_later(240,exit=True); unittest.main(module="test_storage",argv=["diagnostic"],verbosity=2)'
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -m unittest discover -s tests -p test_terminal_fixture.py -v
      - name: Canonical hook paths
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -m unittest discover -s tests -p test_hooks.py -v
      - name: Public and native task job control
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -m unittest discover -s tests -p test_bootstrap.py -k runtime_job_control -v
      - name: Full native ownership and backend qualification
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- control-test
      - name: Confirm clean tested source
        run: test -z "$(git status --porcelain)"
