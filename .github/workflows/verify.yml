name: Deliberate toolchain verification
"on":
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      prune_hosted_sdks:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit expected at the selected ref
        required: true
        type: string
      prune_hosted_sdks:
        description: Explicitly remove declared unused SDKs on disposable Linux runners
        type: boolean
        default: false
      diagnose_stopped_cancellation:
        description: Run only the deliberate Apple Silicon cancellation diagnostic
        type: boolean
        default: false
      diagnose_bootstrap_scan:
        description: Run only the repeated macOS bootstrap scanner diagnostic
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !inputs.diagnose_stopped_cancellation && !inputs.diagnose_bootstrap_scan }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {runner: ubuntu-24.04, mode: host-nix, module: core, engine: docker}
          - {runner: ubuntu-24.04-arm, mode: host-nix, module: core, engine: docker}
          - {runner: macos-15, mode: host-nix, module: core, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: javascript, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: rust, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: python, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: go, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: flutter, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: swift, engine: docker}
          - {runner: ubuntu-24.04, mode: host-nix, module: compose, engine: docker}
          - {runner: ubuntu-24.04, mode: container-nix, module: core, engine: docker}
          - {runner: ubuntu-24.04, mode: container-nix, module: core, engine: podman}
          - {runner: macos-15, mode: host-nix, module: swift, engine: docker}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      TOOLCHAIN_MODE: ${{ matrix.mode }}
      TOOLCHAIN_CONTAINER_ENGINE: ${{ matrix.engine }}
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checkout with spaces
      - name: Confirm exact source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
          EVENT: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$EVENT" = "$EXPECTED"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Optional disposable SDK cleanup
        if: inputs.prune_hosted_sdks && runner.os == 'Linux'
        env:
          TOOLCHAIN_MODE: host-nix
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- ci-prune --module "$MODULE" --apply --sudo
      - name: Apple SDK preflight
        if: runner.os == 'macOS' && matrix.module == 'swift'
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- sdk-doctor apple
      - name: Verify using the local command
        run: |
          if [ "$TOOLCHAIN_MODE" = container-nix ]; then
            nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- bootstrap-test "$TOOLCHAIN_CONTAINER_ENGINE"
          else
            nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- module "$MODULE" verify
          fi
      - name: Report project cache use
        if: always()
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- cache-status
      - name: Qualify initialization and standalone starter
        if: matrix.module == 'core'
        run: |
          engine="$TOOLCHAIN_CONTAINER_ENGINE"
          if [ "$TOOLCHAIN_MODE" = host-nix ]; then engine=host-nix; fi
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- init-test "$engine"
      - name: Qualify native JavaScript update validation
        if: matrix.mode == 'host-nix' && matrix.module == 'javascript'
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- javascript-test
      - name: Qualify native service ownership and backend
        if: matrix.mode == 'host-nix' && (matrix.module == 'core' || runner.os == 'macOS')
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- control-test
      - name: Qualify native Python update validation
        if: matrix.mode == 'host-nix' && matrix.module == 'python'
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- python-test
      - name: Qualify native Gradle update validation
        if: matrix.mode == 'host-nix' && matrix.module == 'compose'
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- gradle-test
      - name: Qualify native Cargo update validation
        if: matrix.mode == 'host-nix' && matrix.module == 'rust'
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- rust-test
      - name: Qualify native SwiftPM update validation
        if: matrix.mode == 'host-nix' && matrix.module == 'swift'
        run: nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- swift-test
  diagnose-stopped-cancellation:
    if: inputs.diagnose_stopped_cancellation
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      TOOLCHAIN_MODE: host-nix
      CHAINMAN_TEST_STOPPED_TASK_STACKS: '1'
      CHAINMAN_TEST_TERMINAL_STACKS: '1'
      CHAINMAN_TEST_TASK_SIGNAL_TRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checkout with spaces
      - name: Confirm exact diagnostic source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
          EVENT: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$EVENT" = "$EXPECTED"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Run ownership and repetitions in one control profile
        timeout-minutes: 26
        run: |
          set -o pipefail
          mkdir -p cancellation-diagnostic
          printf 'Source: %s\nPhase: entering one control profile\n' "$(git rev-parse HEAD)" | tee cancellation-diagnostic/entry.log
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- control-cancellation-diagnostic 2>&1 | tee -a cancellation-diagnostic/entry.log
      - name: Retain entry, ownership, repetition and phase results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stopped-cancellation-phases-${{ github.sha }}
          path: checkout with spaces/cancellation-diagnostic/
          if-no-files-found: error
          retention-days: 14
  diagnose-bootstrap-scan:
    if: inputs.diagnose_bootstrap_scan
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      TOOLCHAIN_MODE: host-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: checkout with spaces
      - name: Confirm exact diagnostic source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
          EVENT: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$EVENT" = "$EXPECTED"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Check scanner error reporting and repeat the bootstrap boundary
        timeout-minutes: 26
        run: |
          set -o pipefail
          mkdir -p bootstrap-scan-diagnostic
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -m unittest discover -s tests -p test_hooks.py -v 2>&1 | tee bootstrap-scan-diagnostic/unit.log
          for attempt in 1 2 3 4 5; do
            nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec python3 -B -m unittest discover -s tests -p test_bootstrap.py -k test_public_explicit_scan_inside_managed_profile -v 2>&1 | tee "bootstrap-scan-diagnostic/attempt-$attempt.log"
          done
      - name: Retain bootstrap scanner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-scan-${{ github.sha }}
          path: checkout with spaces/bootstrap-scan-diagnostic/
          if-no-files-found: error
          retention-days: 14
