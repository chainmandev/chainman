// Resolve and lock every project configuration, including buildscript inputs.
// This script is passed explicitly by the updater; it is never installed globally.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.artifacts.dsl.LockMode
import java.security.MessageDigest

def optionalCommonizedCInterop = { configuration ->
    def attributes = configuration.attributes.keySet().collectEntries {
        [(it.name): configuration.attributes.getAttribute(it).toString()]
    }
    attributes['org.gradle.usage'] == 'kotlin-commonized-cinterop' &&
        attributes['org.jetbrains.kotlin.cinteropCommonizerArtifactType'] == 'klib' &&
        attributes['org.jetbrains.kotlin.native.commonizerTarget']
}

def absentOptionalVariant
absentOptionalVariant = { failure ->
    // KGP uses a lenient artifact view here: most Kotlin libraries publish no
    // commonized C-interop variant. Only that structured failure is optional.
    // Avoid importing Gradle internals; unfamiliar failure shapes fail closed.
    if (failure.hasProperty('failure')) {
        return failure.failure.class.name ==
            'org.gradle.internal.component.resolution.failure.type.NoCompatibleVariantsFailure'
    }
    def causes = failure.hasProperty('causes') ? failure.causes :
        (failure.cause ? [failure.cause] : [])
    !causes.empty && causes.every { absentOptionalVariant(it) }
}

gradle.beforeProject { project ->
    project.dependencyLocking.lockAllConfigurations()
    if (!gradle.startParameter.writeDependencyLocks) {
        project.dependencyLocking.lockMode = LockMode.STRICT
    }
    project.buildscript.configurations.configureEach {
        resolutionStrategy.activateDependencyLocking()
    }
}

gradle.rootProject { root ->
    ['chainmanResolveAll', 'chainmanInspect'].each { taskName ->
    root.tasks.register(taskName) {
        notCompatibleWithConfigurationCache('Dependency update resolves the complete configuration inventory')
        dependsOn { gradle.includedBuilds.collect { it.task(':' + taskName) } }
        doLast {
            if (gradle.startParameter.writeDependencyLocks != (taskName == 'chainmanResolveAll')) {
                throw new GradleException('Chainman resolution writes locks; inspection must not write them')
            }
            def projects = []
            def edges = []
            root.allprojects.each { project ->
                projects.add([id: project.buildTreePath, directory: project.projectDir.absolutePath])
                [project.configurations, project.buildscript.configurations].each { configurations ->
                    configurations.findAll { it.canBeResolved }.sort { it.name }.each { configuration ->
                        // resolve() throws on unresolved dependencies; the report-only
                        // dependencies task can otherwise print FAILED and still exit 0.
                        if (optionalCommonizedCInterop(configuration)) {
                            // A graph with absent optional variants cannot persist
                            // Gradle lock state. Lock its strict matching inventory
                            // below instead, on both update and read-only inspection.
                            configuration.resolutionStrategy.deactivateDependencyLocking()
                            def artifacts = configuration.incoming.artifactView { lenient true }.artifacts
                            // Materialize matching artifacts for checksum verification;
                            // missing coordinates/artifacts, ambiguity and lock failures
                            // remain fatal even in this optional artifact inventory.
                            artifacts.artifactFiles.files
                            artifacts.failures.each { failure ->
                                if (!absentOptionalVariant(failure)) {
                                    throw failure
                                }
                            }
                            def inventory = configuration.copyRecursive()
                            configuration.incoming.resolutionResult.allDependencies.each { dependency ->
                                if (dependency instanceof UnresolvedDependencyResult) {
                                    if (!(dependency.attempted instanceof ModuleComponentSelector) ||
                                        !absentOptionalVariant(dependency.failure)) {
                                        throw dependency.failure
                                    }
                                    inventory.exclude(group: dependency.attempted.group, module: dependency.attempted.module)
                                }
                            }
                            inventory.resolutionStrategy.activateDependencyLocking()
                            inventory.resolve()
                            if (inventory.incoming.artifacts.artifacts.collect { it.id }.toSet() !=
                                artifacts.artifacts.collect { it.id }.toSet()) {
                                throw new GradleException('Strict C-interop lock inventory changed matching artifacts')
                            }
                        } else {
                            configuration.resolve()
                        }
                        configuration.incoming.resolutionResult.allDependencies.each { dependency ->
                            if (dependency instanceof ResolvedDependencyResult && dependency.selected.id instanceof ProjectComponentIdentifier) {
                                def requested = dependency.requested
                                edges.add([coordinate: requested instanceof ModuleComponentSelector ? "${requested.group}:${requested.module}" : null,
                                    selected: dependency.selected.id.buildTreePath])
                            }
                        }
                    }
                }
            }
            def destination = System.getenv('CHAINMAN_GRADLE_REPORT_DIR')
            if (destination) {
                def key = MessageDigest.getInstance('SHA-256').digest(root.projectDir.absolutePath.bytes).encodeHex().toString()
                new File(destination, key + '.json').text = JsonOutput.toJson([schema: 1, projects: projects, edges: edges])
            }
        }
    }
    }
}
