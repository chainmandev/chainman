name: Podman service teardown diagnostics
"on":
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source commit to inspect; this workflow cannot publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ github.workspace }}/checkout with spaces
    env:
      CHAINMAN_SETUP: auto
      TOOLCHAIN_MODE: host-nix
      CHAINMAN_TEST_CONTAINER: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: checkout with spaces
          ref: ${{ inputs.candidate_sha }}
      - name: Confirm exact source
        env:
          EXPECTED: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Observe unchanged teardown assertions
        run: |
          export CHAINMAN_TEST_ENGINE_PATH="$PATH"
          # Expand PATH inside the pinned shell, retaining only engine discovery.
          # shellcheck disable=SC2016
          nix --extra-experimental-features 'nix-command flakes' run path:./nix#just -- exec sh -eu -c 'export PATH="$PATH:$CHAINMAN_TEST_ENGINE_PATH"; exec python3 -B -' <<'PY'
          import json, pathlib, subprocess, sys, time, unittest
          sys.path.insert(0, "tests")
          from test_bootstrap import BootstrapTests
          original = BootstrapTests.run_bootstrap
          def holders(state):
              witnesses = {}
              for path in state.glob("*.lease"):
                  st = path.stat()
                  witnesses[(st.st_dev, st.st_ino)] = path.name
              for process in pathlib.Path("/proc").glob("[0-9]*"):
                  try:
                      for fd in (process / "fd").iterdir():
                          try:
                              st = fd.stat()
                              witness = witnesses.get((st.st_dev, st.st_ino))
                              if witness:
                                  print("LEASE-FD-HOLDER", process.name,
                                        (process / "comm").read_text().strip(), fd.name,
                                        witness, flush=True)
                          except (FileNotFoundError, PermissionError, ProcessLookupError):
                              pass
                  except (FileNotFoundError, PermissionError, ProcessLookupError):
                      pass
          def observe(self, *args, **kwargs):
              result = original(self, *args, **kwargs)
              if args == ("services-status",):
                  print("INITIAL-STATUS", self.id(), result.stdout, flush=True)
                  status = json.loads(result.stdout)
                  if status.get("running"):
                      state = pathlib.Path(status["state"])
                      for path in sorted(state.glob("*.lease*")):
                          print("LEASE", path.name, path.read_text(), flush=True)
                      holders(state)
                      snapshot = subprocess.run(
                          ["podman", "ps", "--all", "--filter", "volume=" + self.test_volume,
                           "--format", "{{json .}}"], capture_output=True, text=True, timeout=30)
                      print("FIXTURE-CONTAINERS", snapshot.stdout, snapshot.stderr, flush=True)
                      started = time.monotonic()
                      for delay in (2, 5, 15):
                          time.sleep(max(0, delay - (time.monotonic() - started)))
                          later = original(self, *args, **kwargs)
                          print("LATER-STATUS", delay, later.stdout, flush=True)
                      holders(state)
              # Preserve the immediate observation and original assertion.
              return result
          BootstrapTests.run_bootstrap = observe
          suite = unittest.TestSuite(BootstrapTests(name) for name in (
              "test_container_stale_setup_consent_preserves_piped_task_input",
              "test_public_nested_service_entry_preserves_fd9_context",
          ))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Confirm source was not edited
        if: always()
        run: test -z "$(git status --porcelain)"
