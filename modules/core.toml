name = "core"
profile = "core"
directory = "."
inputs = ["examples/core/*.json", "examples/core/*.txt"]
artifacts = ["examples/core/labels.txt"]
[commands]
setup = [["python3", "scripts/generate.py", "--check"]]
build = [["python3", "scripts/toolchain_build.py"]]
test = [["python3", "-B", "-m", "unittest", "discover", "-s", "examples/core"], ["python3", "-B", "-m", "unittest", "discover", "-s", "tests"]]
verify = [["python3", "scripts/format.py", "--check"], ["python3", "scripts/generate.py", "--check"], ["python3", "-B", "-m", "unittest", "discover", "-s", "examples/core"], ["python3", "-B", "-m", "unittest", "discover", "-s", "tests"], ["python3", "scripts/toolchain_build.py"]]
format = [["python3", "scripts/format.py"], ["python3", "scripts/generate.py"]]
